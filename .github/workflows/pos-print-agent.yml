name: POS Print Agent tests

on:
  push:
    paths:
      - 'POSPrinter/**'
      - '.github/workflows/pos-print-agent.yml'
  pull_request:
    paths:
      - 'POSPrinter/**'
      - '.github/workflows/pos-print-agent.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: POSPrinter
